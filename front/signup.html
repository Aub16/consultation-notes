<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demande de création de compte — Consultation Notes</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body class="auth-body">
  <div class="auth-card" style="width: 440px;">
    <div class="header">
      <div class="brand">
        <div class="logo-wrap">CN</div>
        <span class="name">Consultation Notes</span>
      </div>
      <p class="subtitle">Demande de création de compte</p>
    </div>

    <div class="banner danger hidden" id="error-banner">
      <div class="icon">!</div>
      <span id="error-message"></span>
    </div>

    <form id="signup-form">
      <div class="field">
        <label>Vous êtes</label>
        <div class="role-toggle" id="role-toggle">
          <button type="button" class="role-option active" data-role="etudiant">Étudiant</button>
          <button type="button" class="role-option" data-role="enseignant">Enseignant</button>
        </div>
        <input type="hidden" id="role" value="etudiant" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="firstName">Prénom</label>
          <input type="text" id="firstName" placeholder="Léa" required autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="lastName">Nom</label>
          <input type="text" id="lastName" placeholder="Martin" required autocomplete="family-name" />
        </div>
      </div>

      <div class="field" id="level-field">
        <label for="level">Niveau / classe</label>
        <input type="text" id="level" placeholder="ex. L3" />
      </div>

      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="prenom.nom@ecole.fr" required autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="8 caractères minimum" required minlength="8" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" placeholder="8 caractères minimum" required minlength="8" autocomplete="new-password" />
      </div>

      <div class="banner warning" id="pending-banner">
        <div class="icon">!</div>
        <span>Votre demande sera soumise à la validation d'un superviseur avant activation.</span>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Demander la création du compte</button>
    </form>

    <div class="banner warning hidden" id="success-banner">
      <div class="icon">✓</div>
      <span>Votre demande a été envoyée. Un superviseur doit valider votre compte avant votre première connexion.</span>
    </div>

    <div class="foot">
      <span>Déjà un compte ?</span>
      <a href="index.html">Se connecter</a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/signup.js"></script>
</body>
</html>
