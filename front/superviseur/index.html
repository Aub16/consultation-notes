<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Consultation Notes</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="content">
    <div class="page-header">
      <h1>Administration</h1>
      <p>Supervision des comptes, cours et notes de l'établissement</p>
    </div>

    <div class="banner solid hidden" id="action-banner" style="width: 100%; margin-top: 26px;">
      <div class="icon">!</div>
      <span id="action-banner-message"></span>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">En attente de validation</div>
        <div class="value warning" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Étudiants</div>
        <div class="value" id="stat-students">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Enseignants</div>
        <div class="value" id="stat-teachers">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Cours actifs</div>
        <div class="value" id="stat-courses">—</div>
      </div>
    </div>

    <div class="section-title">
      <span>Demandes de création de compte</span>
      <span class="pill warning" id="pending-pill">0 en attente</span>
    </div>

    <div id="loading" class="spinner-row">Chargement…</div>

    <div id="requests" class="card-list"></div>

    <div id="empty-state" class="card empty-state hidden">
      <div class="icon">✅</div>
      <div class="title">Aucune demande en attente</div>
      <div class="desc">Toutes les demandes de création de compte ont été traitées.</div>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/topbar.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/superviseur.js"></script>
</body>
</html>
