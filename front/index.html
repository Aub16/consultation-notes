<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Consultation Notes</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="header">
      <div class="brand">
        <div class="logo-wrap">CN</div>
        <span class="name">Consultation Notes</span>
      </div>
      <p class="subtitle">Connectez-vous à votre espace</p>
    </div>

    <div class="banner danger hidden" id="error-banner">
      <div class="icon">!</div>
      <span id="error-message"></span>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="prenom.nom@ecole.fr" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Se connecter</button>
    </form>

    <div class="foot">
      <span>Pas encore de compte ?</span>
      <a href="signup.html">Créer un compte</a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
